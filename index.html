<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lezgi VPN</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-1:      #06120B;
    --bg-2:      #0C2215;
    --bg-3:      #123A22;
    --row-bg:    #0E2417;
    --row-sel:   #184A2C;
    --btn:       #2FBF6E;
    --btn-2:     #6EF0A5;
    --btn-text:  #042A16;
    --text:      #FFFFFF;
    --text-dim:  #A8D8BC;
    --tint:      #C9F0D8;
    --elipse-1:  #3FBF74;
    --elipse-2:  #1E7A45;
    --elipse-3:  #0A2E1A;
    --border-thin: 1px solid rgba(160, 255, 200, 0.85);
  }

  body {
    min-height: 100vh;
    background: linear-gradient(25deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 70px 16px 60px;
    gap: 28px;
    position: relative;
  }

  /* ===== ПОДПИСЬ СОЗДАТЕЛЯ (верхний правый угол) ===== */
  .creator {
    position: fixed;
    top: 14px;
    right: 16px;
    z-index: 50;
    padding: 8px 14px;
    border-radius: 30px;
    background: linear-gradient(145deg, var(--row-sel), var(--row-bg));
    border: 1px solid rgba(160, 255, 200, 0.7);
    box-shadow: 0 0 16px rgba(120, 255, 180, 0.35), inset 0 0 10px rgba(0, 0, 0, 0.5);
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: 0.4px;
    color: var(--text);
    text-shadow: 0 0 8px rgba(150, 255, 200, 0.7);
    white-space: nowrap;
    user-select: none;
  }
  .creator span { color: #9CFFC6; }

  /* ============ АВАТАРКА ============ */
  .avatar-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    margin-top: 40px;
    margin-bottom: 20px;
  }

  .avatar {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 32px;
    background: linear-gradient(25deg, #3FBF74 0%, #1E7A45 45%, #0A2E1A 100%);
    border: 1.5px solid rgba(180, 255, 210, 0.9);
    box-shadow: 0 0 22px rgba(90, 255, 160, 0.35), 0 0 50px rgba(40, 180, 100, 0.45), inset 0 0 20px rgba(0, 0, 0, 0.55);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2;
    transition: transform 0.25s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    cursor: pointer;
    user-select: none;
  }

  .avatar.active {
    transform: translateY(-6px) scale(1.03);
    border-color: #CFFFE2;
    box-shadow:
      0 0 32px rgba(120, 255, 180, 0.9),
      0 0 70px rgba(60, 220, 130, 0.75),
      0 12px 40px rgba(0, 0, 0, 0.6),
      inset 0 0 26px rgba(180, 255, 210, 0.25);
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    opacity: 0.9;
    filter: blur(0.5px);
  }
  .blob1 { width: 150px; height: 150px; top: -55px; left: -55px; background: var(--elipse-1); }
  .blob2 { width: 115px; height: 115px; bottom: -40px; right: -32px; background: var(--elipse-3); }
  .blob3 { width: 85px; height: 85px; top: 45%; left: -35px; background: var(--elipse-2); }
  .blob4 { width: 100px; height: 100px; top: -30px; right: -40px; background: var(--elipse-3); }

  .ava-text {
    position: relative;
    z-index: 3;
    text-align: center;
    color: var(--text);
    font-weight: 900;
    letter-spacing: 1px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7), 0 0 18px rgba(150, 255, 200, 0.7);
    line-height: 1.05;
  }
  .ava-text .line1 { font-size: 34px; }
  .ava-text .line2 { font-size: 34px; }

  /* ===== АНТЕННА ===== */
  .antenna {
    position: absolute;
    z-index: 4;
    width: 46px;
    height: 46px;
    top: 16px;
    right: 16px;
    animation: signal 4.5s ease-in-out infinite;
    filter: drop-shadow(0 0 8px rgba(150, 255, 200, 0.95));
  }
  .antenna svg { width: 100%; height: 100%; }
  @keyframes signal {
    0%   { transform: translateY(0); }
    50%  { transform: translateY(26px); }
    100% { transform: translateY(0); }
  }

  .orbit {
    position: absolute;
    inset: -22px;
    border-radius: 50%;
    border: 1px dashed rgba(140, 255, 190, 0.4);
    animation: rotate 14s linear infinite;
    z-index: 1;
    pointer-events: none;
  }
  .orbit .dot {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #9CFFC6;
    box-shadow: 0 0 12px 4px rgba(120, 255, 180, 0.9);
  }
  .orbit .dot:nth-child(1) { top: -3px; left: 50%; transform: translateX(-50%); }
  .orbit .dot:nth-child(2) { bottom: -3px; left: 50%; transform: translateX(-50%); }
  .orbit .dot:nth-child(3) { left: -3px; top: 50%; transform: translateY(-50%); }
  .orbit .dot:nth-child(4) { right: -3px; top: 50%; transform: translateY(-50%); }
  @keyframes rotate {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ============ КАРТОЧКИ ============ */
  .card {
    width: 100%;
    max-width: 420px;
    border-radius: 22px;
    padding: 22px 20px;
    background: linear-gradient(160deg, var(--row-sel), var(--row-bg));
    border: var(--border-thin);
    box-shadow: 0 0 22px rgba(100, 255, 170, 0.22), inset 0 0 18px rgba(0, 0, 0, 0.45);
    text-align: center;
    transition: transform 0.25s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    cursor: pointer;
    user-select: none;
  }

  .card.active {
    transform: translateY(-8px) scale(1.02);
    border-color: #CFFFE2;
    box-shadow:
      0 0 30px rgba(120, 255, 180, 0.85),
      0 0 60px rgba(60, 220, 130, 0.6),
      0 14px 40px rgba(0, 0, 0, 0.6),
      inset 0 0 22px rgba(180, 255, 210, 0.18);
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
    padding: 9px 0;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-dim);
  }
  .row svg { flex: 0 0 auto; stroke: var(--tint) !important; }
  .row b { color: var(--text); font-weight: 800; }

  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .card-placeholder {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .card-placeholder b { color: var(--text); font-weight: 800; }

  /* ===== ЗЕЛЁНЫЕ КНОПКИ ===== */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    margin-top: 12px;
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.4px;
    border-radius: 14px;
    border: 1px solid rgba(180, 255, 210, 0.95);
    background: linear-gradient(145deg, var(--btn-2), var(--btn));
    color: var(--btn-text);
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
    box-shadow: 0 0 18px rgba(80, 240, 140, 0.55), inset 0 0 12px rgba(255, 255, 255, 0.35);
    text-shadow: 0 1px 2px rgba(255, 255, 255, 0.25);
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(100, 255, 170, 0.9), inset 0 0 14px rgba(255, 255, 255, 0.45);
    filter: brightness(1.05);
  }
  .btn:active { transform: scale(0.98); }

  .btn svg { stroke: var(--btn-text) !important; }

  .final {
    margin-top: 10px;
    font-size: 20px;
    font-weight: 800;
    color: var(--text);
    text-shadow: 0 0 14px rgba(150, 255, 200, 0.7);
    display: flex;
    align-items: center;
    gap: 10px;
  }
</style>
</head>
<body>

<script>
  // ==== Копирование ссылки ====
  const copyBtn  = document.getElementById('copyBtn');
  const copyText = document.getElementById('copyText');

  copyBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    const url = copyBtn.dataset.url;
    try {
      await navigator.clipboard.writeText(url);
    } catch (err) {
      const ta = document.createElement('textarea');
      ta.value = url;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    copyText.textContent = 'Скопировано ✔️';
    setTimeout(() => {
      copyText.textContent = 'Скопировать';
    }, 1500);
  });

  // ==== Активна только одна рамка ====
  const pressables = document.querySelectorAll('.pressable');

  function activate(el) {
    if (el.classList.contains('active')) {
      el.classList.remove('active');
      return;
    }
    pressables.forEach(p => p.classList.remove('active'));
    el.classList.add('active');
  }

  pressables.forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.btn')) return;
      activate(el);
    });

    el.addEventListener('touchend', (e) => {
      if (e.target.closest('.btn')) return;
      e.preventDefault();
      activate(el);
    }, { passive: false });
  });
</script>
